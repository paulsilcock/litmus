packages:
  - packages/*

catalog:
  "@electric-sql/pglite": 0.4.2
  "@hono/node-server": 1.19.13
  "@types/node": 25.5.0
  "@types/ws": 8.18.1
  ai: 6.0.0
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  hono: 4.12.10
  playwright: 1.59.1
  reflect-metadata: 0.2.2
  tsyringe: 4.10.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  ws: 8.20.0
  zod: 4.4.3

overrides:
  vite@*: "catalog:"

# `vite` is an alias of the Vite+ core package, whose version (1.x) does
# not match the Vite range that Vitest declares as a peer.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true

# Let Vite+ manage the Node.js and pnpm versions (see the Vite+ env guide).
runtimeOnFail: ignore
pmOnFail: ignore
