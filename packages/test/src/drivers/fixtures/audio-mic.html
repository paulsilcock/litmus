<!doctype html>
<html>
  <body>
    <script>
      // Consume the mic stream and route it into the AudioContext
      // destination so the test can observe what arrived using the
      // capture pump (which taps any new AudioContext.destination).
      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
        const ctx = new AudioContext();
        const source = ctx.createMediaStreamSource(stream);
        source.connect(ctx.destination);
      });
    </script>
  </body>
</html>
