name: Publish

# Publishes every public package to npm when a release commit
# ("chore: release v<version>", from the Prepare release workflow) lands on
# main, then tags it and creates the GitHub release.
#
# Authentication is npm trusted publishing: each package on npmjs.com trusts
# this workflow file and the `npm` environment, so no npm token is stored in
# GitHub. The first version of a new package must be published from a
# maintainer's machine with `node scripts/publish.ts <version>`.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Kept outside the `npm` environment, so approval is only requested when a
  # release commit is detected.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.detect.outputs.release }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect a release commit
        id: detect
        run: |
          subject="$(git log -1 --format=%s)"
          version="$(jq -r .version package.json)"
          # Prefix match: the squash merge appends the PR number.
          if [[ "$subject" == "chore: release v$version"* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Detected release v$version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write # push the tag and create the GitHub release
      id-token: write # npm trusted publishing
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # History is needed for the release notes.
          fetch-depth: 0
      - name: Check the tag does not exist
        run: |
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: "1.3.0"
          node-version: "24"
          # No dependency cache in a job that publishes.
          cache: false
      - run: vp install
      - run: vp run -r build
      - name: Publish to npm (dry run)
        run: node scripts/publish.ts "$VERSION" --dry-run
      - name: Publish to npm
        run: node scripts/publish.ts "$VERSION"
      - name: Push the tag
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp dlx changelogithub@15.0.5 --to "v$VERSION" --name "v$VERSION"
