name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history for vitest --changed to find the merge base
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: "0.1.15"
          node-version: "24"
          cache: true
      - run: vp install
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright (browsers)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vp dlx playwright install --with-deps chromium
      - run: vp check
      - name: Run changed tests (PR)
        if: github.event_name == 'pull_request'
        run: vp test --changed ${{ github.event.pull_request.base.sha }}
      - name: Run full test suite (push to main)
        if: github.event_name == 'push'
        run: vp test
      - run: vp run -r build
